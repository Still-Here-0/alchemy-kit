[project]
name = "alchemy-kit"
version = "0.2.3"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "pandas>=3.0.3",
    "pandera>=0.31.1",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.50",
    "sqlglot>=26.0.0",
]

[project.optional-dependencies]
mssql = ["pyodbc>=5.3.0"]
mysql = ["pymysql>=1.1.0"]
mariadb = ["pymysql>=1.1.0"]
postgresql = ["psycopg[binary]>=3.1.0"]
oracle = ["oracledb>=2.0.0"]
all = ["alchemy-kit[mssql,mysql,mariadb,postgresql,oracle]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alchemy_kit"]
force-include = { "alchemy_kit/py.typed" = "alchemy_kit/py.typed" }

[dependency-groups]
dev = [
    "import-linter>=2.12",
    "pandas-stubs>=3.0.3.260530",
    "pydeps>=3.0.6",
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
markers = ["local: needs a local database connection, run with --run-local"]

[tool.importlinter]
root_package = "alchemy_kit"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "alchemy_kit.builder",
    "alchemy_kit.model",
    "alchemy_kit.connect",
    "alchemy_kit.resources",
    "alchemy_kit.types",
]
